<title>Alana — Semanas 1 y 2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23a3e635'/></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--lime:#a3e635;--lime-deep:#65a30d;--ink:#1b1a2a;--ink-2:#2c2a42;
  --bone:#f7f6f2;--coral:#fb7185;--mute:#8b8aa3;--gold:#f0c93d}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--ink);color:var(--bone);
  min-height:100vh;padding:24px 20px 60px}
.shell{max-width:940px;margin:0 auto}
.back{display:inline-block;font-family:'Chakra Petch',sans-serif;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-decoration:none;
  margin-bottom:20px}
.back:hover{color:var(--lime)}
.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;
  gap:16px;margin-bottom:26px}
.name{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:clamp(34px,7vw,52px);
  line-height:.95;letter-spacing:-.02em}
.name em{font-style:normal;color:var(--lime)}
.tag{color:var(--mute);font-size:13px;margin-top:6px}
.meter{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.mlabel{font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute)}
.blocks{display:flex;gap:3px}
.blk{width:13px;height:22px;background:var(--ink-2);border:1px solid #3a3854;
  transition:background .18s,transform .18s}
.blk.on{background:var(--lime);border-color:var(--lime);transform:translateY(-2px)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.week{display:flex;gap:4px;background:var(--ink-2);padding:4px}
.week button,.day{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--mute);
  border:none;cursor:pointer;padding:9px 14px;transition:all .15s}
.week button.sel{background:var(--lime);color:var(--ink)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.day{background:var(--ink-2);border:1px solid #3a3854}
.day:hover{border-color:var(--lime-deep);color:var(--bone)}
.day.sel{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.day .dot{display:inline-block;width:6px;height:6px;margin-left:7px;background:var(--lime);
  vertical-align:middle}
.day.sel .dot{background:var(--lime-deep)}
.daymeta{font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute);padding-bottom:12px;
  border-bottom:2px solid var(--ink-2);margin-bottom:18px}
.card{background:var(--ink-2);border-left:4px solid var(--lime);padding:18px 20px;
  margin-bottom:12px}
.card.done{border-left-color:var(--lime-deep);opacity:.58}
.card.aft{border-left-color:var(--coral)}
.card.aft.done{border-left-color:#9f4a58}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  margin-bottom:10px}
.time{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.1em;color:var(--lime);white-space:nowrap}
.card.aft .time{color:var(--coral)}
.subj{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:18px;
  letter-spacing:-.01em;margin-bottom:3px}
.what{font-size:14px;line-height:1.55;color:#cfced9}
.card.done .subj,.card.done .what{text-decoration:line-through;text-decoration-thickness:1px}
.check{flex-shrink:0;width:26px;height:26px;background:transparent;border:2px solid #4a4866;
  cursor:pointer;display:grid;place-items:center;transition:all .15s;padding:0}
.check:hover{border-color:var(--lime)}
.check.on{background:var(--lime);border-color:var(--lime)}
.check svg{width:14px;height:14px;stroke:var(--ink);stroke-width:3.5;fill:none;
  opacity:0;transition:opacity .15s}
.check.on svg{opacity:1}
.check:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.links a{font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:600;
  letter-spacing:.03em;text-decoration:none;color:var(--ink);background:var(--lime);
  padding:7px 12px;display:inline-flex;align-items:center;gap:6px;transition:transform .15s}
.links a:hover{transform:translate(1px,-1px);box-shadow:-2px 2px 0 var(--lime-deep)}
.links a:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.links a svg{width:11px;height:11px;stroke:var(--ink);stroke-width:2.5;fill:none}

.khan{margin-top:14px;padding:12px 14px;background:#232140;border:1px dashed #4a4866}
.khan-head{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.khan-head svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2}
.khan-title{font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold)}
.khan-course{font-size:11px;color:var(--mute);margin-bottom:8px;font-style:italic}
.khan-unit{display:flex;align-items:flex-start;gap:9px;padding:5px 0;font-size:13px;
  color:#dcdbe8;cursor:pointer}
.khan-unit input{margin-top:3px;accent-color:var(--gold);width:15px;height:15px;flex-shrink:0}
.khan-unit.checked{color:var(--mute);text-decoration:line-through}
.khan-note{font-size:11px;color:var(--mute);margin-top:6px}

.proj{margin-top:22px;background:linear-gradient(180deg,#232140,var(--ink-2));
  border:1px solid #3a3854;padding:0;overflow:hidden}
.proj-head{padding:18px 22px;border-bottom:1px solid #3a3854;display:flex;
  justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.proj-head h3{font-family:'Chakra Petch',sans-serif;font-size:19px;color:var(--gold);
  letter-spacing:-.01em}
.proj-status{font-family:'Chakra Petch',sans-serif;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;padding:5px 10px;background:#3a3854;color:var(--mute)}
.proj-status.unlocked{background:var(--lime);color:var(--ink)}
.proj-body{padding:20px 22px}
.proj-step{font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.proj-links{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.proj-link{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--ink);
  border:1px solid #3a3854;text-decoration:none;transition:all .15s}
.proj-link:hover{border-color:var(--gold)}
.proj-link.visited{border-color:var(--lime-deep);background:#1f2a1a}
.proj-link .num{flex-shrink:0;width:22px;height:22px;border:1.5px solid var(--gold);
  color:var(--gold);display:grid;place-items:center;font-family:'Chakra Petch',sans-serif;
  font-size:11px;font-weight:700}
.proj-link.visited .num{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.proj-link .lbl{font-size:13.5px;color:var(--bone);flex:1}
.proj-link .go{width:14px;height:14px;stroke:var(--mute);stroke-width:2.2;fill:none;
  flex-shrink:0}
.proj-hint{font-size:12px;color:var(--mute);margin-top:6px;font-style:italic}

.lock{margin-top:16px;padding:26px 20px;text-align:center;border:1px dashed #4a4866}
.lock svg{width:26px;height:26px;stroke:var(--mute);fill:none;stroke-width:1.8;
  margin-bottom:10px}
.lock p{font-size:13px;color:var(--mute);line-height:1.6;max-width:340px;margin:0 auto}
.lock b{color:var(--gold)}

.unlocked-content{margin-top:18px;padding-top:18px;border-top:1px solid #3a3854}
.proj-concept{background:#1f1d33;border-left:3px solid var(--gold);padding:13px 16px;
  margin-bottom:16px;font-size:13.5px;line-height:1.6;color:#dcdbe8}
.proj-concept b{color:var(--gold);font-family:'Chakra Petch',sans-serif;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px}
.proj-task{font-size:14.5px;line-height:1.6;color:var(--bone);margin-bottom:14px}
.proj-task b{color:var(--lime)}

.ex-toggle{font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--coral);background:none;border:1px solid var(--coral);
  padding:8px 14px;cursor:pointer;margin-bottom:12px;transition:all .15s}
.ex-toggle:hover{background:var(--coral);color:var(--ink)}
.example{display:none;background:var(--ink);border-left:3px solid var(--coral);
  padding:14px 16px;margin-bottom:16px;font-size:13px;line-height:1.7;color:#cfced9;
  white-space:pre-wrap}
.example.show{display:block}

.proj-write{margin-top:8px}
.proj-write label{font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);display:block;margin-bottom:8px}
textarea.entrega{width:100%;min-height:190px;background:var(--ink);color:var(--bone);
  border:1px solid #3a3854;padding:14px;font-family:'DM Sans',sans-serif;font-size:13.5px;
  line-height:1.6;resize:vertical}
textarea.entrega:focus{outline:none;border-color:var(--lime)}
.proj-actions{display:flex;justify-content:space-between;align-items:center;
  margin-top:10px;flex-wrap:wrap;gap:10px}
.savebar{font-size:11px;color:var(--mute)}
.savebar.saved{color:var(--lime)}
.markdone{font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;background:var(--lime);color:var(--ink);
  border:none;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.markdone.on{background:var(--ink);color:var(--lime);border:1.5px solid var(--lime)}
.markdone svg{width:13px;height:13px;stroke:currentColor;stroke-width:3;fill:none}

.sat{background:linear-gradient(135deg,var(--lime-deep),#4d7c0f);padding:22px;margin-top:20px}
.sat h3{font-family:'Chakra Petch',sans-serif;font-size:17px;margin-bottom:8px}
.sat p{font-size:14px;line-height:1.6;color:#f0f7e0}
.sat textarea{width:100%;min-height:80px;margin-top:12px;background:rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.25);color:#fff;padding:10px;font-family:'DM Sans',sans-serif;
  font-size:13px}
.sat textarea::placeholder{color:rgba(255,255,255,.55)}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.tools button{font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;background:transparent;color:var(--mute);
  border:1px solid #3a3854;padding:10px 16px;cursor:pointer;transition:all .15s}
.tools button:hover{border-color:var(--lime);color:var(--lime)}
.tools button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--lime);color:var(--ink);padding:12px 22px;font-family:'Chakra Petch',sans-serif;
  font-weight:600;font-size:13px;letter-spacing:.05em;transition:transform .25s;z-index:50}
.toast.show{transform:translateX(-50%) translateY(0)}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--ink-2);font-size:12px;
  color:var(--mute);line-height:1.6}
@media(max-width:560px){.head{flex-direction:column;align-items:flex-start}
  .meter{align-items:flex-start}.blk{width:10px;height:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  example:'Título: El asiento del bus\n\n[G] Todos los días el mismo señor se sentaba en el asiento 14 del bus. Nunca se bajaba.\n\nYo tomaba ese bus a las 3. Él ya estaba. Llegaba a mi parada, me bajaba, y él seguía. Un día lo tomé a las 7 de la mañana. Ahí estaba. Mismo asiento. Misma ropa.\n\nLe pregunté al chofer. Me dijo que no había nadie en el asiento 14. Que ese asiento estaba roto hace años y nadie se sentaba ahí.\n\n[V] Al día siguiente subí y el asiento 14 estaba vacío. Me senté. Y cuando el bus arrancó, escuché a alguien atrás decirle al chofer: "hay una niña en el 14 que nunca se baja".\n\nQué me costó: el final. Escribí tres versiones. Las dos primeras explicaban demasiado.'

var week=1,day='Lun';
var done={}, links={}, entregas={}, khanState={}, satNotes={};
var K_DONE='alana-progreso-s1s2', K_LINKS='alana-links-s1s2', K_ENTREGA='alana-entrega-s1s2',
    K_KHAN='alana-khan-s1s2', K_SAT='alana-sat-notas-s1s2';

function loadAll(){
  try{var r=localStorage.getItem(K_DONE);if(r)done=JSON.parse(r);}catch(e){}
  try{var r2=localStorage.getItem(K_LINKS);if(r2)links=JSON.parse(r2);}catch(e){}
  try{var r3=localStorage.getItem(K_ENTREGA);if(r3)entregas=JSON.parse(r3);}catch(e){}
  try{var r4=localStorage.getItem(K_KHAN);if(r4)khanState=JSON.parse(r4);}catch(e){}
  try{var r5=localStorage.getItem(K_SAT);if(r5)satNotes=JSON.parse(r5);}catch(e){}
}
function saveDone(){try{localStorage.setItem(K_DONE,JSON.stringify(done));}catch(e){}}
function saveLinks(){try{localStorage.setItem(K_LINKS,JSON.stringify(links));}catch(e){}}
function saveEntregas(){try{localStorage.setItem(K_ENTREGA,JSON.stringify(entregas));}catch(e){}}
function saveKhan(){try{localStorage.setItem(K_KHAN,JSON.stringify(khanState));}catch(e){}}
function saveSat(){try{localStorage.setItem(K_SAT,JSON.stringify(satNotes));}catch(e){}}

var ICON_CHECK='<svg viewBox="0 0 24 24"><polyline points="4 12 9 18 20 6"/></svg>';
var ICON_OUT='<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
var ICON_STAR='<svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>';
var ICON_LOCK='<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);}

function dayTotalUnits(w,d){ return DATA[w][d].blocks.length + 1; }
function allBlocksTotal(){
  var n=0;[1,2].forEach(function(w){DAYS.forEach(function(d){n+=dayTotalUnits(w,d);});});return n;
}
function allBlocksDone(){return Object.keys(done).filter(function(k){return done[k];}).length;}

function renderDays(){
  var w=document.getElementById('days');w.innerHTML='';
  DAYS.forEach(function(d){
    var blocks=DATA[week][d].blocks;
    var all=blocks.every(function(_,i){return done[week+'|'+d+'|'+i];}) && done[week+'|'+d+'|proyecto'];
    var b=document.createElement('button');
    b.className='day'+(d===day?' sel':'');
    b.innerHTML=d+(all?'<span class="dot"></span>':'');
    b.onclick=function(){day=d;render();};
    w.appendChild(b);
  });
}
function renderMeter(){
  var tt=allBlocksTotal(),g=allBlocksDone();
  document.getElementById('mlabel').textContent=g+' de '+tt+' bloques';
  var w=document.getElementById('blocksEl');w.innerHTML='';
  var shown=20,filled=Math.round(g/tt*shown);
  for(var i=0;i<shown;i++){var bl=document.createElement('div');
    bl.className='blk'+(i<filled?' on':'');w.appendChild(bl);}
}

function renderList(){
  var info=DATA[week][day];
  document.getElementById('meta').textContent='Semana '+week+' · '+day+' · '+info.hrs+' · '+(info.blocks.length+1)+' bloques (incluye proyecto)';
  var list=document.getElementById('list');list.innerHTML='';

  info.blocks.forEach(function(b,i){
    var key=week+'|'+day+'|'+i,isDone=!!done[key];
    var card=document.createElement('div');
    card.className='card'+(b.a?' aft':'')+(isDone?' done':'');

    var linksHtml='';
    if(b.l){linksHtml='<div class="links">'+b.l.map(function(x){
      return '<a href="'+x[1]+'" target="_blank" rel="noopener">'+x[0]+ICON_OUT+'</a>';}).join('')+'</div>';}

    var khanHtml='';
    if(b.khan){
      var unitsHtml=b.khan.units.map(function(u,ui){
        var kkey=week+'|'+day+'|'+i+'|'+ui;
        var checked=!!khanState[kkey];
        return '<label class="khan-unit'+(checked?' checked':'')+'" data-kkey="'+kkey+'">'+
          '<input type="checkbox" '+(checked?'checked':'')+'> '+u+'</label>';
      }).join('');
      khanHtml='<div class="khan"><div class="khan-head">'+ICON_STAR+
        '<span class="khan-title">Meta Khan Academy hoy — '+b.khan.units.length+
        (b.khan.units.length===1?' unidad':' unidades')+'</span></div>'+
        '<div class="khan-course">Curso: '+b.khan.course+'</div>'+unitsHtml+
        (b.khan.review?'<div class="khan-note">Hoy es repaso: no hay unidad nueva, marcá las que ya dominás mejor.</div>':'')+
        '</div>';
    }

    card.innerHTML='<div class="top"><div><div class="time">'+b.t+'</div><div class="subj">'+b.s+'</div></div>'+
      '<button class="check'+(isDone?' on':'')+'" aria-label="Marcar como hecho">'+ICON_CHECK+'</button></div>'+
      '<div class="what">'+b.d+'</div>'+linksHtml+khanHtml;

    card.querySelector('.check').onclick=function(){done[key]=!done[key];saveDone();render();};
    list.appendChild(card);

    if(b.khan){
      card.querySelectorAll('.khan-unit').forEach(function(el){
        el.querySelector('input').onchange=function(){
          var kkey=el.getAttribute('data-kkey');
          khanState[kkey]=this.checked;
          saveKhan();
          el.classList.toggle('checked',this.checked);
        };
      });
    }
  });
}

function renderProject(){
  var p=PROJECTS[week][day];
  var box=document.getElementById('proj');
  var doneKey=week+'|'+day+'|proyecto';
  var isDone=!!done[doneKey];

  var linkKeysFor=function(){return (p.learn||[]).map(function(_,i){return week+'|'+day+'|'+i;});};
  var visitedCount=linkKeysFor().filter(function(k){return !!links[k];}).length;
  var totalLinks=(p.learn||[]).length;
  var unlocked = totalLinks===0 || visitedCount>=totalLinks;

  var html='<div class="proj-head"><h3>Proyecto del día — '+DAYFULL[day]+'</h3>'+
    '<span class="proj-status'+(unlocked?' unlocked':'')+'">'+
    (unlocked?'Desbloqueado':(visitedCount+'/'+totalLinks+' links abiertos'))+'</span></div>';

  html+='<div class="proj-body">';

  if(totalLinks>0){
    html+='<div class="proj-step">Paso 1 — Abrí estos links antes de empezar</div><div class="proj-links">';
    p.learn.forEach(function(l,i){
      var lkey=week+'|'+day+'|'+i;
      var vis=!!links[lkey];
      html+='<a class="proj-link'+(vis?' visited':'')+'" data-lkey="'+lkey+'" href="'+l[1]+'" target="_blank" rel="noopener">'+
        '<span class="num">'+(vis?'✓':(i+1))+'</span><span class="lbl">'+l[0]+'</span>'+ICON_OUT+'</a>';
    });
    html+='</div><div class="proj-hint">Se abren en una pestaña nueva. Al volver, tu tarea de hoy se desbloquea aquí abajo.</div>';
  }

  if(!unlocked){
    html+='<div class="lock">'+ICON_LOCK+'<p>Abrí <b>'+(totalLinks-visitedCount)+' link'+
      ((totalLinks-visitedCount)===1?'':'s')+' más</b> de arriba para desbloquear la tarea de hoy.</p></div>';
  }else{
    var entKey=week+'|'+day;
    var savedText=(entregas[entKey]!==undefined)?entregas[entKey]:p.tmpl;
    html+='<div class="unlocked-content">'+
      '<div class="proj-concept"><b>Concepto del día</b>'+p.concept+'</div>'+
      '<div class="proj-task"><b>Tu tarea:</b> '+p.task+'</div>'+
      '<button class="ex-toggle" id="ex-toggle">Ver ejemplo</button>'+
      '<div class="example" id="ex-box">'+p.example+'</div>'+
      '<div class="proj-write"><label>Tu entregable (esto es lo que ve papá)</label>'+
      '<textarea class="entrega" id="entrega-box" placeholder="Escribí aquí...">'+
      escapeHtml(savedText)+'</textarea></div>'+
      '<div class="proj-actions"><span class="savebar" id="savebar">&nbsp;</span>'+
      '<button class="markdone'+(isDone?' on':'')+'" id="markdone-btn">'+
      (isDone?ICON_CHECK+' Entregado':'Marcar como entregado')+'</button></div>'+
      '</div>';
  }

  html+='</div>';
  box.innerHTML=html;

  if(totalLinks>0){
    box.querySelectorAll('.proj-link').forEach(function(a){
      a.addEventListener('click',function(){
        var lkey=a.getAttribute('data-lkey');
        if(!links[lkey]){links[lkey]=true;saveLinks();}
        setTimeout(render,120);
      });
    });
  }

  if(unlocked){
    var exToggle=document.getElementById('ex-toggle');
    var exBox=document.getElementById('ex-box');
    exToggle.onclick=function(){
      exBox.classList.toggle('show');
      exToggle.textContent=exBox.classList.contains('show')?'Ocultar ejemplo':'Ver ejemplo';
    };
    var ta=document.getElementById('entrega-box');
    var bar=document.getElementById('savebar');
    var saveTimer=null;
    ta.addEventListener('input',function(){
      bar.textContent='Escribiendo…';bar.classList.remove('saved');
      clearTimeout(saveTimer);
      saveTimer=setTimeout(function(){
        entregas[week+'|'+day]=ta.value;
        saveEntregas();
        bar.textContent='Guardado ✓';bar.classList.add('saved');
      },500);
    });
    document.getElementById('markdone-btn').onclick=function(){
      done[doneKey]=!done[doneKey];
      saveDone();
      render();
    };
  }
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderSat(){
  var box=document.getElementById('sat');
  var key=week+'|sab';
  var txt=satNotes[key]||'';
  box.innerHTML='<h3>'+SAT[week][0]+'</h3><p>'+SAT[week][1]+'</p>'+
    '<textarea placeholder="Notas del board meeting (opcional)...">'+escapeHtml(txt)+'</textarea>';
  var ta=box.querySelector('textarea');
  var t=null;
  ta.addEventListener('input',function(){
    clearTimeout(t);
    t=setTimeout(function(){satNotes[key]=ta.value;saveSat();},500);
  });
}

function render(){
  renderDays();
  renderMeter();
  renderList();
  renderProject();
  renderSat();
}

document.querySelectorAll('.week button').forEach(function(btn){
  btn.onclick=function(){
    document.querySelectorAll('.week button').forEach(function(b){b.classList.remove('sel');});
    btn.classList.add('sel');week=+btn.dataset.w;day='Lun';render();
  };
});

document.getElementById('btn-copy').onclick=function(){
  var lines=['Progreso de Alana — '+new Date().toLocaleDateString('es-PA'),''];
  [1,2].forEach(function(w){
    var wd=0,wt=0;
    DAYS.forEach(function(d){
      var n=DATA[w][d].blocks.length+1;wt+=n;
      DATA[w][d].blocks.forEach(function(_,i){if(done[w+'|'+d+'|'+i])wd++;});
      if(done[w+'|'+d+'|proyecto'])wd++;
    });
    lines.push('Semana '+w+': '+wd+'/'+wt+' bloques');
    DAYS.forEach(function(d){
      var n=DATA[w][d].blocks.length+1,bd=0;
      DATA[w][d].blocks.forEach(function(_,i){if(done[w+'|'+d+'|'+i])bd++;});
      if(done[w+'|'+d+'|proyecto'])bd++;
      lines.push('  '+d+': '+bd+'/'+n+(bd===n?' ✓':''));
      var ent=entregas[w+'|'+d];
      if(ent&&ent.trim().length>0){
        lines.push('    Entregable: '+(ent.length>80?ent.slice(0,80)+'…':ent).replace(/\n/g,' '));
      }
    });
    lines.push('');
  });
  lines.push('Total: '+allBlocksDone()+' de '+allBlocksTotal()+' bloques');
  var txt=lines.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast('Copiado — pégalo en WhatsApp');},
      function(){fallback(txt);});
  }else{fallback(txt);}
};
function fallback(txt){
  var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';
  ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Copiado — pégalo en WhatsApp');}
  catch(e){toast('No se pudo copiar');}
  document.body.removeChild(ta);
}

document.getElementById('btn-reset').onclick=function(){
  if(confirm('¿Seguro? Se borra todo tu progreso, tus links abiertos y tus entregables de las semanas 1 y 2.')){
    done={};links={};entregas={};khanState={};satNotes={};
    saveDone();saveLinks();saveEntregas();saveKhan();saveSat();
    render();toast('Progreso borrado');
  }
};

loadAll();
render();
})();
</script>
